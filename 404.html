<!DOCTYPE html>
<!-- Served by GitHub Pages (with a 404 status) for any URL that doesn't exist. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found – Abdulla B</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050c10" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(35, 138, 175, 0.16), transparent 70%), #050c10;
      color: #93b0bb; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    img { width: 56px; height: 56px; }
    p.code { margin-top: 28px; font: 600 13px ui-monospace, monospace; letter-spacing: 0.3em; color: #6ad4ed; }
    h1 { margin-top: 10px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.03em; color: #fff; }
    p.lead { margin-top: 12px; max-width: 26rem; }
    a.home {
      display: inline-block; margin-top: 28px; padding: 12px 24px; border-radius: 999px;
      background: linear-gradient(135deg, #6ad4ed, #238aaf); color: #050c10; font-weight: 600; text-decoration: none;
    }
    a.home:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="" />
    <p class="code">404</p>
    <h1>This page doesn’t exist</h1>
    <p class="lead">The link may be old or mistyped. Everything about my work lives on the main page.</p>
    <a class="home" href="/">Go to the portfolio</a>
  </main>
</body>
</html>
